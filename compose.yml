# Backing services for the distributed examples and integration tests.
#
#   docker compose up -d          # both
#   docker compose up -d valkey   # Redis messaging only (RedisMessagingExample)
#
# The integration tests do NOT use this file: they start their own containers through
# Testcontainers on random ports, so the two can run side by side.

services:
  postgres:
    image: postgres:16-alpine
    container_name: agenor-postgres
    environment:
      POSTGRES_DB: agenor
      POSTGRES_USER: agenor
      POSTGRES_PASSWORD: agenor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenor -d agenor"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    container_name: agenor-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

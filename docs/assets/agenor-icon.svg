<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="agenor icon">
  <style>
    .a-fill    { fill: #185FA5; }
    .a-halo    { fill: #185FA5; opacity: .18; }
    .a-counter { fill: #E6F1FB; }
    .a-dot     { fill: #0C447C; }
    .a-sat-a   { fill: #185FA5; opacity: .65; }
    .a-sat-b   { fill: #185FA5; opacity: .45; }
    .a-edge    { stroke: #185FA5; fill: none; stroke-width: 2; stroke-linecap: round; opacity: .5; }
    @media (prefers-color-scheme: dark) {
      .a-fill    { fill: #378ADD; }
      .a-halo    { fill: #378ADD; opacity: .22; }
      .a-counter { fill: #042C53; }
      .a-dot     { fill: #85B7EB; }
      .a-sat-a   { fill: #378ADD; opacity: .7; }
      .a-sat-b   { fill: #378ADD; opacity: .5; }
      .a-edge    { stroke: #378ADD; }
    }
  </style>
  <!--
    Same cluster as the wordmark's "o" (agenor-wordmark.svg), redrawn at
    16px optical scale: satellite directions (up-right, up-left, down-right)
    and colors are copied verbatim from the wordmark; radii are NOT scaled
    from it — at favicon size the wordmark's r=2.5..3 satellites and 1px
    edges disappear, so this mark uses larger satellites and a 2px stroke
    to stay legible at 16px.
  -->
  <line class="a-edge" x1="32.4" y1="17.9" x2="36.8" y2="14.7"/>
  <line class="a-edge" x1="13.6" y1="17.8" x2="9.3"  y2="14.5"/>
  <line class="a-edge" x1="32.9" y1="31.4" x2="37.1" y2="34.2"/>

  <circle class="a-halo" cx="23" cy="25" r="14"/>
  <circle class="a-fill" cx="23" cy="25" r="11"/>
  <circle class="a-counter" cx="23" cy="25" r="5.5"/>
  <circle class="a-dot" cx="23" cy="25" r="2.8"/>

  <circle class="a-sat-a" cx="40.6" cy="11.8" r="4"/>
  <circle class="a-sat-b" cx="5.9"  cy="11.9" r="3.4"/>
  <circle class="a-sat-b" cx="40.6" cy="36.4" r="3.4"/>
</svg>

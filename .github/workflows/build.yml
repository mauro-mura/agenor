name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean compile

      - name: Run tests and coverage
        run: mvn -B verify org.jacoco:jacoco-maven-plugin:report

      # Fails when a deprecation is past its declared removal release, has no
      # declared release, or carries no forRemoval at all. Each of those three has
      # already let dead surface survive: dev.agenor.core.AgentDirectory by four
      # releases, WebConsoleServer by twenty-nine. Nothing else runs this.
      - name: Check the removal schedule
        run: bash tools/api-census.sh --check

      # CONTRIBUTING declares this budget binding from 0.35.0 on. Until now nothing ran it:
      # the rule existed, the check did not.
      - name: Check the CHANGELOG budget
        run: bash tools/changelog-budget.sh --check

      # A tracked file that points at the maintainer's unpublished notes, or names a row in one
      # of their registers, cannot be resolved by a reader who has only the repository. bc50b55
      # had to resolve a batch of these by hand. The script's own header carries the examples,
      # and is exempt for exactly that reason — as is this comment, now that it names none.
      - name: Check public references
        run: bash tools/public-refs-check.sh

      # Globbed, not enumerated: the enumeration listed 4 of the 11 modules and
      # went stale the moment ADR-027 split the runtime into four.
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: '*/target/site/jacoco/'
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo
            echo '```'
            bash tools/coverage-report.sh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

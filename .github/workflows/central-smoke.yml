name: Central smoke test

# Manual on purpose: it can only run after a deployment has been published in the
# Central Portal and has synced to repo1, which takes minutes to hours and is not
# an event this repository can observe.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published Agenor version to resolve from Central (e.g. 0.34.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Resolve from Central and run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # No `cache: maven` here. A warm cache could answer a resolution that
          # Central cannot, which is the one thing this job exists to detect.

      - name: Resolve the BOM and run the README's first agent
        env:
          AGENOR_VERSION: ${{ inputs.version }}
        run: |
          mvn -B -f tools/central-smoke/pom.xml \
              -Dagenor.version="$AGENOR_VERSION" \
              -Dmaven.repo.local="$RUNNER_TEMP/central-smoke-repo" \
              test

      - name: No logging backend on the consumer classpath
        # The acceptance criterion from the publishing work plan: a consumer who
        # asked for agenor-core and agenor-runtime must not inherit a backend.
        # slf4j-api is expected; a binding is the failure.
        env:
          AGENOR_VERSION: ${{ inputs.version }}
        run: |
          mvn -B -q -f tools/central-smoke/pom.xml \
              -Dagenor.version="$AGENOR_VERSION" \
              -Dmaven.repo.local="$RUNNER_TEMP/central-smoke-repo" \
              -DoutputFile="$RUNNER_TEMP/deps.txt" -DappendOutput=false \
              dependency:list
          cat "$RUNNER_TEMP/deps.txt"
          if grep -Eq 'logback|log4j|slf4j-simple|slf4j-nop|slf4j-jdk14|slf4j-reload4j' \
              "$RUNNER_TEMP/deps.txt"; then
            echo "::error::a logging backend reached the consumer classpath"
            exit 1
          fi

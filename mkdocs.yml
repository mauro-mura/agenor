site_name: Agenor Framework
site_url: https://agenor.dev/docs
site_description: Multi-agent coordination for the JVM — autonomous agents that negotiate, delegate, and execute, with optional LLM reasoning
site_author: Agenor Team
repo_url: https://github.com/mauro-mura/Agenor
repo_name: mauro-mura/agenor

theme:
  name: material
  logo: assets/agenor-icon.svg
  favicon: assets/agenor-icon.svg
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search

# ADRs are excluded — kept only in the repository for internal reference
exclude_docs: |
  adr/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: ignore

nav:
  - Home: index.md
  - Guides:
    - Getting Started: getting-started.md
    - Architecture: architecture.md
    - Configuration: configuration.md
    - Agent Development: agent-development.md
    - Behaviors:
      - Overview: behaviors/README.md
      - Cyclic: behaviors/CyclicBehavior.md
      - OneShot: behaviors/OneShotBehavior.md
      - Waker: behaviors/WakerBehavior.md
      - Scheduled: behaviors/ScheduledBehavior.md
      - EventDriven: behaviors/EventDrivenBehavior.md
      - FSM: behaviors/FSMBehavior.md
      - Conditional: behaviors/ConditionalBehavior.md
      - Sequential: behaviors/SequentialBehavior.md
      - Parallel: behaviors/ParallelBehavior.md
      - Pipeline: behaviors/PipelineBehavior.md
      - Batch: behaviors/BatchBehavior.md
      - Retry: behaviors/RetryBehavior.md
      - Throttled: behaviors/ThrottledBehavior.md
      - CircuitBreaker: behaviors/CircuitBreakerBehavior.md
      - Reflection: behaviors/ReflectionBehavior.md
      - Human-In-The-Loop: behaviors/hitl.md
  - Coordination:
    - Messaging Guide: messaging.md
    - Agent Directory: directory.md
    - Distributed Quick Start: distributed-quick-start.md
    - Message Filtering: message-filtering.md
    - Dialog Protocol: dialog-protocol.md
    - Memory Management: memory.md
    - Agent State Persistence: persistence.md
  - LLM & Adapters:
    - LLM Overview: llm-integration.md
    - Guardrails: guardrails.md
    - MCP: adapters/mcp.md
    - Redis Messaging: adapters/redis.md
    - JDBC Directory: adapters/jdbc-directory.md
    - Persistent HITL: hitl-persistence.md
  - Observability: observability.md
  - Integrations:
    - Spring Boot Starter: spring-boot-starter.md
  - API Reference: api/index.html